name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unicode-studio-premium

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/unicode-studio-premium

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assemblePlayDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unicode-studio-debug-apk
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
