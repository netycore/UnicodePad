name: Build NatkhatBoard APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore signing keystore
        env:
          NATKHAT_KEYSTORE_BASE64: ${{ secrets.NATKHAT_KEYSTORE_BASE64 }}
        run: |
          echo "$NATKHAT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/natkhatboard-release.jks"

      - name: Build debug APK
        env:
          NATKHAT_STORE_FILE: ${{ runner.temp }}/natkhatboard-release.jks
          NATKHAT_STORE_PASSWORD: ${{ secrets.NATKHAT_STORE_PASSWORD }}
          NATKHAT_KEY_ALIAS: natkhatboard
          NATKHAT_KEY_PASSWORD: ${{ secrets.NATKHAT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFdroidDebug

      - name: Cleanup signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/natkhatboard-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NatkhatBoard-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
